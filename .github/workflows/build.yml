name: build
# Builds the mod for Windows and Linux against the pinned OpenRAC SDK, then lists every archive in
# one SHA256SUMS. The launcher installs a release's archive only when SHA256SUMS lists it with the
# same hash, so all platforms are published together by one job: a job per platform that uploaded
# its own SHA256SUMS would overwrite the others'.
on:
  push:
    branches: [master, main, testing]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Optional release tag to create or update (e.g. v1.0.0)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Check out mod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out OpenRAC SDK 1.14.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenRAC/OpenRAC
          ref: sdk-v1.14.2
          path: .openrac
          persist-credentials: false
          sparse-checkout: sdk
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check release metadata and hook declarations
        run: python tests/release_preflight.py --sdk-header .openrac/sdk/include/openrac/games/rac1.hpp
      - name: Select and verify release tag
        id: tag
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.publish_tag }}
        run: |
          release_tag=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$REQUESTED_RELEASE_TAG"
            if [ -n "$release_tag" ] && [ "$GITHUB_REF_NAME" != "main" ] && [ "$GITHUB_REF_NAME" != "master" ]; then
              echo "Releases may only be requested manually from main/master, not $GITHUB_REF_NAME"
              exit 1
            fi
          fi
          if [ -n "$release_tag" ]; then
            version=$(python -c 'import json; print(json.load(open("openrac-mod.json"))["version"])')
            if [ "$release_tag" != "v$version" ]; then
              echo "Release tag $release_tag does not match openrac-mod.json version $version"
              exit 1
            fi
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-2025
            library: weapon_wheel_pause.dll
          # Ubuntu 22.04, the oldest runner: the library then needs glibc 2.35 or later, as the
          # OpenRAC launcher's Linux game does.
          - name: linux-x86_64
            os: ubuntu-22.04
            library: weapon_wheel_pause.so
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            library: weapon_wheel_pause.so
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out mod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out OpenRAC SDK 1.14.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenRAC/OpenRAC
          ref: sdk-v1.14.2
          path: .openrac
          persist-credentials: false
          sparse-checkout: sdk
      - name: Verify OpenRAC SDK API 1.14
        run: |
          sdk_version_file=.openrac/sdk/cmake/OpenRACModConfigVersion.cmake
          test -f "$sdk_version_file"
          grep -Fq 'set(PACKAGE_VERSION "1.14")' "$sdk_version_file"
          echo 'Using OpenRAC SDK 1.14.2 (mod API 1.14)'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Ninja
        run: python -m pip install ninja
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          if (-not $vs) { throw "No Visual Studio installation found" }
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -Append $env:GITHUB_ENV }
          }
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOpenRACMod_DIR="$GITHUB_WORKSPACE/.openrac/sdk/cmake"
      - name: Build
        run: cmake --build build --parallel
      - name: Package
        run: python .openrac/sdk/tools/package_mod.py build/package/* -o dist
      - name: Verify installable package
        env:
          # Not PLATFORM: the MSVC environment sets Platform, and Windows merges the two names.
          PACKAGE_PLATFORM: ${{ matrix.name }}
          LIBRARY: ${{ matrix.library }}
        run: |
          version=$(python -c 'import json; print(json.load(open("openrac-mod.json"))["version"])')
          package="dist/pause-weapon-wheel-$version-$PACKAGE_PLATFORM.zip"
          test -f "$package"
          python -c 'import sys,zipfile; names=set(zipfile.ZipFile(sys.argv[1]).namelist()); assert "openrac-mod.json" in names; assert sys.argv[2] in names, sys.argv[2]' \
            "$package" "lib/$PACKAGE_PLATFORM/$LIBRARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pause-weapon-wheel-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: pause-weapon-wheel-*
          path: dist
          merge-multiple: true
      - name: Generate and verify release checksums
        run: |
          (cd dist && sha256sum -- *.zip > SHA256SUMS && sha256sum --check SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pause-weapon-wheel
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: [preflight, checksums]
    if: needs.preflight.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pause-weapon-wheel
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && \
             ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Creating missing Git tag $RELEASE_TAG at $GITHUB_SHA"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$GITHUB_SHA"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --title "Weapon Wheel Pause $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "Weapon Wheel Pause $RELEASE_TAG"
          fi
